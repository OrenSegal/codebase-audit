name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.9", os: ubuntu-22.04}  # setup-python has no 3.9 build for newer images
          - {python: "3.x", os: ubuntu-latest}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 skills/audit/scripts/scan.py --check
      - run: python3 -m unittest discover tests
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .

  # One stable name for the main-branch ruleset to require (.github/rulesets/main.json).
  # Matrix jobs report one check per leg, and the leg names change with the matrix.
  # This job passes only when every job above passed or was skipped.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [checks, plugin]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
